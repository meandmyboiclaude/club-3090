      # (self-counted steps), planner-router steps, p75=193 tok/step calib.
      - GENESIS_ENABLE_PN102_CONTRACT=1
      - GENESIS_PN100_AUTO_DEFAULT=1
      # [v4 2026-07-18] auto-mode convergence. The -5pt vs bare-10240 is TWO
      # orthogonal defects: compression (~-4pt, silent — the router's per-item
      # step estimate ran below what the budget afforded and the model complied)
      # and starvation (~-1.5pt, observable — think block never closed).
      # Escalation cannot fix compression (nothing fires); the banner cannot fix
      # starvation. Hence both, plus one generous budget instead of a ladder.
      #
      # COUPLED — enable together or neither. Under the v3 sized banner a 10240
      # budget renders "wrap up around Step 53" with the headroom gate failing,
      # i.e. a 53-step implied scope with no early-stop license on requests that
      # need three. The static banner states no budget at all: N is a CHECKPOINT
      # ("around Step N, check whether your answer is settled"), so continuing is
      # framed as normal rather than as an exception.
      - GENESIS_PN100_TIER_BUDGETS=0,10240,10240,10240
      - GENESIS_PN102_STATIC_BANNER=${GENESIS_PN102_STATIC_BANNER:-0}
      # [v5 2026-07-19, BENCH ONLY] floorless stop + progress-conditional
      # continue. v4's checkpoint delay was measured as a hard floor (0 items
      # <500 rtok vs 36 in old auto); the unconditional keep-going fed the deep
      # band (73.4% of spend @ 60% acc). Takes precedence over STATIC_BANNER.
      - GENESIS_PN102_BANNER_V5=${GENESIS_PN102_BANNER_V5:-0}
      # Starvation backstop: one continuation resuming INSIDE the think region.
      # Non-streaming, bounded to one pass, every failure path returns the
      # original response unchanged. Reaches above the generous cap only for the
      # ~8% that exhaust it — the sweep curve was still rising at 10240.
      - GENESIS_PN101_ESCALATE=1
