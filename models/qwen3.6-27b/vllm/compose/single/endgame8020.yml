# Qwopus variant of tools-text. Deltas vs tools-text-aibox.yml (Lorbus):
#   image  nightly-b4c80ec0 -> nightly-b53b1c7
#   model  /root/.cache/huggingface/qwen3.6-27b-autoround-int4 -> XReyRobert repo-id
