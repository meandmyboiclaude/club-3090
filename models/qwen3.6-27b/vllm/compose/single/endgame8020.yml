        # hold and a later hit resumed from the wrong recurrent state — silent
        # output corruption. max-num-batched-tokens == block size == 4128, so any
        # prefill sharing a step with a decode took a 4124-token first chunk: the
        # common path. Restored upstream tests: 20 failed before, 115 passed after.
        # Must run after the five patches above (it re-anchors their output).
        # Kill switch GENESIS_DISABLE_PR48361=1. No-ops on dev1060cherry, which
        # still carries the original full #48361 pick.
        # [2026-07-27 STATE ON THIS ENDPOINT] With the champion defaults mirrored
        # here, PREFIX_CACHING_ARG defaults to --no-enable-prefix-caching, so
        # mamba_cache_mode is no longer force-set to align and this patch RIDES
        # ALONG DARK. It is wired anyway and deliberately NOT dropped: prod was
        # the one endpoint historically running align+APC (p95 prompt ~30.3K, so
        # blocks really do hash here, unlike BUG-131's <=4128 zero-hit argument),
        # and the moment anyone sets PREFIX_CACHING_ARG=--enable-prefix-caching
        # with a non-replayssm CACHE_OVERRIDE the corruption class is live again.
        # An applier is cheap; re-deriving this at flip time is not.
        python3 /fixes/patch_pr48361_mamba_align_split.py
        # [H119 route-API — 2026-07-25 / added to prod 2026-07-27 C3] LAST on
        # purpose: its two anchors (scheduler.py `_free_request` call,
        # chat_completion/api_router.py JSONResponse) must be counted against
        # fully-patched content, and five earlier patches rewrite scheduler.py.
        # Inert unless GENESIS_ENABLE_H119_ROUTE_API=1; a drifted anchor with
        # the flag ON prints a boxed ERROR instead of a silent no-op. That flag
        # is NOT declared in this compose's environment block, so it is dark
        # twice over until someone declares it (M3 in the 07-27 review).
        # Anchors on all three pins: python3 fixes/verify_h119_route_api_anchors.py
        python3 /fixes/patch_h119_route_api.py
        # [PN114-SEED — 2026-07-26 / added to prod 2026-07-27 C3] The PN102
        # think-seed as a FORCED SPAN, so a POST-prefill decision (the H119 route)
        # can still choose it. The seed is rendered inside <think> by the chat
        # template, so forcing it as output is position- and voice-identical —
        # proven by gate M2 (fixes/test_pn114_seed_equivalence.py: 59/59 on the
        # boot pin, identical ids at identical positions incl. the MTP acceptance
        # matrix). The BANNER is a system turn, out of the model's voice, and is
        # deliberately NOT moved.
        # LAST on purpose: all five anchors are text that pn114_forced_span,
        # h119_lens_router and pn101_answer_rescue wrote earlier.
        # DEFAULT OFF (GENESIS_ENABLE_PN114_SEED_SPAN=1 to arm;
        # GENESIS_PN114_SEED_MODE=mirror|routed) and neither flag is declared
        # here, so this is dark on prod exactly as it is on bench.
        # Anchors on both live pins: python3 fixes/verify_pn114_seed_anchors.py
        python3 /fixes/pn114_seed_ids.py
        python3 /fixes/patch_pn114_seed_span.py
        exec vllm serve "$@"
      - --
    command:
      # [endgame 2026-07-13] FULL_AND_PIECEWISE (attn FULL, GDN piecewise) — the PN125
      # cluster's mode. Was left at PIECEWISE from the tools-text base, which silently
      # overrode PN125 (explicit operator setting wins over verify_and_update_config).
      # Stable via PN79 + P66/P78 + PN126-130/364 warmups + PN358 refresh + P67b routing.
      - --compilation-config
      - '{"cudagraph_mode": "FULL_AND_PIECEWISE"}'
      # [Wave-3b 2026-07-13] torch profiler via engine arg (dev1060 retired the env-var
      # gate; routes attach only when profiler-config is set). Inert until /start_profile.
      # REMOVE after the kernel-engineering campaign (dev-only surface).
      - --profiler-config
      - '{"profiler": "torch", "torch_profiler_dir": "/profiles"}'
      - --model
      # [2026-07-18 promote] was: XReyRobert/Qwopus3.6-27B-v2-GPTQ-Pro-MTP-BF16 (rollback = restore that line)
      - /root/.cache/huggingface/thinkingcap-gptq-pro-v2
      - --served-model-name
      - qwen3.6
      - thinkingcap
      - qwen3.6-autoround
      - qwen3.6-27b-autoround
      - qwen3.6-hindsight
      - qwen3.5-9b-hindsight
      - --quantization
      - gptq_marlin
      - --dtype
      - float16
      - --disable-custom-all-reduce
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      # [2026-07-14 USER spec: 65K — 15K caps on most callers (hindsight etc),
      # 60K for something big, 4-5K buffer. 6-day Phoenix prod traffic
      # (10,114 reqs): max total(prompt+gen)=58.6K, zero >60K, p95=30.3K.]
      - "${MAX_MODEL_LEN:-65000}"
      - --gpu-memory-utilization
      # [2026-07-14 BUG-072 KILLED — pin RAISED 73K -> 150,967 tok] The
      # 1.63 GiB resident list was PN31 v1's own per-layer big-buf (17
      # full-attn layers x 96MiB, memory-history-traced); fixed by PN31
      # v2/v3 (class-level shared buffer + capture-only exact pool,
      # e7f78b6c + b8dcae8f) and P28 post-load re-attach. Honest re-profile
      # after the fix: 150,967 tok @0.95 / 161K @0.96 / 170K @0.97 / 180K
      # @0.98. Gate results (storm6 x3 + 4-slot concurrent burst4 x2):
      # 0.98 = 0/6, 0.97 = 0-1/6, 0.96 = serial-green but CONCURRENT
      # bursts abort round 2, 0.95 = ALL GREEN both.
      #
      # [2026-07-18] --kv-cache-memory REMOVED; KV is profiled again.
      # The pin (last 3489660928, hand-lowered from the profiler's own 0.95
      # fit-value 4088487424) made vLLM skip memory profiling entirely and,
      # in its own words, "does not respect the gpu_memory_utilization
      # config" — so the ceiling above was never the safety net it looks
      # like. The "~1.2 GiB device slack" this config assumed was a
      # 2026-07-14 hand-estimate that expired: measured free at OOM was
      # 194 MiB against a 256 MiB activation, i.e. three CUDA OOM aborts
      # (oom_resilience caught them; health stayed green, requests died).
      # It also silently inherited the OLD model's KV geometry — the same
      # 3.25 GiB buys 150,967 tok pre-TC but only 130,000 on
      # thinkingcap-gptq-pro-v2 (~16% more per token), while weights are
      # unchanged at 17.44 GiB. Profiling measures the real activation peak
      # on THIS stack and sizes KV beneath it, so headroom is guaranteed by
      # construction instead of by a stale constant. VLLM_ENABLE_STARTUP_PLAN
      # (already set) persists the result, which is what the pin was
      # supposed to buy: deterministic, fast boots.
      # [2026-07-27 #9 permanence] 0.91 is the settled operating point (0.91 ties
      # 0.92 on wall with more headroom; 0.95 OOMs on 4K prefills — BUG-126).
      # Mirrored from tcbench8021.yml under the 2026-07-27 fit-or-better gate.
      # The unit's Environment=GPU_MEMORY_UTILIZATION=0.93 pin, which silently
      # beat this default (C1), was removed the same day — this default is now
      # the ONLY declared mechanism.
      - "${GPU_MEMORY_UTILIZATION:-0.91}"
      # [2026-07-19 corrected] The "Pin RESTORED" paragraph that stood here was
      # DANGLING — no --kv-cache-memory arg exists in this file; profiling is
      # authoritative. See endgame8020.yml's corrected note + BUG-078/BUG-107.
      # [PN83 — 2026-07-07] rerank micro-slots: PARKED after 2 OOM arms.
      # 29 seats = OOM at KV alloc (~700MB GDN/mamba state over budget);
      # 12 seats = aten::empty alloc failure during warmup (P66 capture list
      # grew [4..96] — the extra cudagraph pools eat the profiler margin).
      # PN83 scheduler patch stays wired but INERT (GENESIS_PN83_CHAT_SEQS=0).
      # Next arm (own window): 8-10 seats + max_cudagraph_capture_size=40
      # (+ maybe util 0.89). Enable = seqs up + env to 5.
      # [2026-07-27 #9 permanence] Default 6 = the settled operating point at
      # util 0.91 + replayssm KV (2.92 GiB / 188,708 tok): +19% vs seqs 4, 0
      # aborts, 0 preemptions. The "5-seq is the KV-limited max" note below
      # described the pre-replayssm 75K-model-len stack and is superseded.
      # The unit's Environment=MAX_NUM_SEQS=4 pin (C1) was removed 2026-07-27.
      - --max-num-seqs
      - "${MAX_NUM_SEQS:-6}"
      # No num-gpu-blocks-override: profiler auto-sizes KV (~174K at util 0.91 / 75K model-len).
      # 75K model-len (not 90K) shrinks each seq's KV reservation so 5x15K peaks ~87% KV (no
      # 100% pin -> no capacity-queue throttle) AND drops the prefill VRAM spike under guardian
      # SOFT 98 (0 gc-fires). 5-seq is the KV-limited max (6 needs util 0.93 -> thrash/OOM).
      # oom_resilience makes any over-budget prefill a graceful 500, never a crash.
      - --max-num-batched-tokens
      - "4128"
      - --long-prefill-token-threshold
      - "4128"
      # [2026-07-14 TODO-PLANNING] interactivity mode = fine-grained CUDA graphs + latency
      # kernels — favors our single-shot/low-concurrency rig. Real dev1060 flag (arg_utils.py).
      - --performance-mode
      - interactivity
      - --kv-cache-metrics
