# Run with:
#   cd <repo>/models/qwen3.6-27b/vllm/compose
#   podman-compose -f single/tools-text-qwopus.yml up -d
# ===========================================================================
# [2026-07-14 END STATE] PROMOTED TO PROD :8020. [2026-07-25] regenerated 1:1 from tcbench8021.yml — see pin comment.
# Rollback: revert the `image:` line below to the previous validated tag —
#   localhost/vllm-qwen36-endgame:dev1060cherry-2204-20260713
#   (boot-guard tag validated-qwopus-3da1671f-w1; image resident in rootful
#    podman) — then `systemctl restart vllm-endgame-8020`. The unit stays the
#   serving unit; only the image moves. Callers untouched: served aliases are
#   identical across both images.
# [2026-07-25 CORRECTED] The former rollback line here read
#   `systemctl disable vllm-endgame-8020 && systemctl enable --now vllm-qwen36`.
# That does NOT work: vllm-qwen36.service is MASKED (verified `systemctl
# is-enabled vllm-qwen36` => masked), so `enable --now` fails and the rollback
# leaves :8020 with nothing serving. The image revert above is the real path.
services:
  vllm-qwen36-27b:
    # [2026-07-25 prod 1:1 sync — USER-ordered] This file is generated 1:1 from
    # tcbench8021.yml (the gate-validated champion config) with only port
    # (8021->8020), container/service names, and OTEL identity differing.
    # Pin: main @ 0ba2aa35 (tag nightly-0ba2aa35a81dcc3246b26291368b53fa2389c7d7,
    # digest-pinned amd64 — survives upstream nightly-tag purge). KNOWN LOSS vs
    # dev1060cherry: #45660 Marlin zero-init (compiled in the old cherry wheel,
    # open upstream). DO NOT flip until g4/g5 gates reviewed (VLLM-UPDATE-20260725.md).
    # Rollback: revert image: to localhost/vllm-qwen36-endgame:dev1060cherry-2204-20260713
    # (boot-guard tag validated-qwopus-3da1671f-w1).
    # [2026-07-27 H2 — image aligned to the bench-validated wheel v2] Prod was
    # still pinned to the STOCK nightly-0ba2aa35 digest while every 07-25 -> 07-27
    # measurement ran on wheel v2 (dev1474cherrymax: stock nightly-0ba2aa35 base +
    # club-dev1474-cherry wheel, max+kvq+mtpq, CI 30163221644). Two days of bench
    # validation sit on cherrymax and none on the digest, so the digest is now the
    # unvalidated arm. Also unblocks VLLM_MTP_HEAD_QUANT, which is a documented
    # no-op on the older image (+8,387 KV tok / +2.5% tok/s once a drop-in sets it).
    # ROLLBACK CHAIN (newest -> oldest, each one validated in its own window):
    #   1. localhost/vllm-qwen36-endgame:dev1474cherrymax-1757-20260725  <- LIVE
    #   2. docker.io/vllm/vllm-openai@sha256:e4f855492d6c95b00cdd21ec642f00d9747df43a3bbedab903316be1a5cd2207
    #      (stock nightly-0ba2aa35; resident locally as 860be1e98815)
    #   3. localhost/vllm-qwen36-endgame:dev1060cherry-2204-20260713
    #      (boot-guard tag validated-qwopus-3da1671f-w1)
    image: localhost/vllm-qwen36-endgame:dev1474cherrymax-1757-20260725
    container_name: vllm-qwen36-endgame
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8020/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
    volumes:
      # Qwopus snapshot lives in the user HF hub cache (not models-cache).
      - /home/user/.cache/huggingface:/root/.cache/huggingface
      # torch.compile + Triton kernel caches — first boot warms (~60-90 sec);
      # subsequent boots reuse cached graphs. Pattern from Sander's PROD launch.
      # Closes club-3090 #22.
      - ../../cache/torch_compile:/root/.cache/vllm/torch_compile_cache
      - ../../cache/triton:/root/.triton/cache
      # [2026-07-13 #47388] startup-plan persistence (else lost on container recreate)
      - ../../cache/startup_plan:/root/.cache/vllm/startup_plan
      # [2026-07-13 Wave-3b] torch-profiler trace output (enables /start_profile + /stop_profile)
      - ../../diagnostics/torch_profiles:/profiles
      # Genesis v7.14+ modular package (replaces patch_genesis_unified.py).
      - ../../patches/genesis/vllm/_genesis:/usr/local/lib/python3.12/dist-packages/vllm/_genesis:ro
      # [endgame 2026-07-13] top-level `sndr` package mount (Sander's deployment shape,
      # host.py sndr_src). The lane-2 file patches inject lazy `from sndr...` imports
      # (e.g. cuda_graph.py FULL-capture path); bootstrap_sndr_alias() only runs in the
      # entrypoint process, so EngineCore needs `import sndr` to resolve natively.
      - ../../patches/genesis/vllm/_genesis/sndr:/usr/local/lib/python3.12/dist-packages/sndr:ro
      - ../../patches/local/qwen3coder_tool_parser_deferred_commit.py:/patches/qwen3coder_tool_parser_deferred_commit.py:ro
      # [2026-07-14 USER] Froggeric template corrupts chat + thinking on Qwopus3.6 —
      # switched to the model's OWN native template (XReyRobert/Qwopus3.6-27B-v2-GPTQ-Pro-MTP-BF16).
      - ../../patches/qwopus-chat-template/chat_template_v2json.jinja:/chat_template.jinja:ro
      - ../../../../../fixes:/fixes:ro
      # [PN119 2026-07-25] lens-router probe (ro) + v2 self-training sink (rw).
      # [PN119-v2 / H1 2026-07-27] probe is now a DIRECTORY mount, mirroring
      # tcbench8021.yml. Two reasons, both live:
      #  1. WRONG DIMENSIONALITY. The old single-FILE mount pointed at
      #     pn119-probe-lens_only.npz, whose mu/sd are (30720,) with no `blocks`
      #     key. The router's FEAT_DIM is 15360 (fixes/pn119_router.py:295), so
      #     _load_probe raised "probe dim 30720 != 15360" (:1466-1467) and
      #     maybe_create() degraded to "router disabled" — prod booted
      #     GENESIS_ENABLE_H119_LENS_ROUTER=1 with no router at all, masked only
      #     by PN119_MODE=shadow. pn119-live/probe.npz is the LAST-ONLY probe
      #     (15360, with `blocks`), which is what the router actually loads.
      #  2. ATOMIC RENAME. The refit timer swaps pn119-live/probe.npz via
      #     tmp+rename (pn119_atomic.py); a single-FILE bind pins the container
      #     to the dead inode and the swap stays invisible until a restart.
      #     Directory mount + router mtime hot-reload = refits land without one.
      # Rollback = restore the old file-mount line:
      #   - /home/user/shared/needfit/pn119-probe-lens_only.npz:/pn119/probe.npz:ro
      - /home/user/shared/needfit/pn119-live:/pn119:ro
      - /home/user/shared/needfit/pn119-sink:/pn119-sink
      # [PN162 2026-07-27] closed-loop budget-calibration ledger, DIRECTORY mount
      # (the host updater writes tmp+rename; a single-FILE bind would pin this
      # container to the dead inode and the swap would be invisible until a
      # restart). Its own mountpoint (not /pn119) so the two consumers stay
      # independent — same shape as tcbench8021.yml. [2026-07-27] the probe above
      # is now a directory mount of the SAME host dir; both mountpoints are kept
      # because the router and the calibrator resolve different filenames.
      # Inert until GENESIS_ENABLE_PN162_BUDGET_CAL=1; absent file = identity.
      - /home/user/shared/needfit/pn119-live:/pn162:ro
      # [BUG-131 prefix-cache 2026-07-25] The engine forces attention block_size
      # up to 4128 (platforms/interface.py:903, "attention page size >= mamba page
      # size"), so hash_block_size resolves to 4128 too and NOTHING under 4129
      # prompt tokens can ever produce a block hash -> prefix_cache_hits_total is
      # structurally 0. Cure = a finer --prefix-match-unit (must divide 4128).
      # [2026-07-27 champion-defaults mirror] Was a hardcoded
      # `./cache-override.yaml` — no variable at all, so the largest measured
      # capacity lever was unreachable from a unit drop-in (H3). Default is now
      # the SHIPPING replayssm rung, byte-identical to tcbench8021.yml (the
      # fit-or-better gate passed 2026-07-27). Revert to the old no-op file with
      # CACHE_OVERRIDE=cache-override.yaml; the APC rung stays
      #   CACHE_OVERRIDE=cache-override-apc.yaml podman-compose ... up -d
      # (⚠ BUG-159: re-derive prefix_match_unit before engaging APC).
      # ⚠ COUPLED with PREFIX_CACHING_ARG below: `use_replayssm_spec` requires
      # mamba_cache_mode=none and prefix caching force-sets it to "align", so
      # flipping one without the other is a boot-time ValueError.
      # See ~/shared/DIAGNOSIS-prefix-cache-zero-hits-20260725.md
      - ./${CACHE_OVERRIDE:-cache-override-replayssm.yaml}:/config/cache-override.yaml:ro
    environment:
      # - CUDA_VISIBLE_DEVICES=0
      # [2026-07-14] unbuffered stdout — crash-loop tracebacks were lost in the 8K block buffer at exit
      - PYTHONUNBUFFERED=1
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - NCCL_CUMEM_ENABLE=0
      - NCCL_P2P_DISABLE=1
      - VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=1
      # [2026-07-13] VLLM_ENFORCE_EAGER removed — never a real vLLM env (dev1060 warns
      # "Unknown vLLM environment variable"); eager is controlled by --enforce-eager.
      - VLLM_NO_USAGE_STATS=1
      # [2026-07-13 #47388] persist memory-profiling + suggested kv-cache-memory under
      # VLLM_CACHE_ROOT/startup_plan; matching-fingerprint reboots skip the profiling
      # and cudagraph-estimation passes -> faster time-to-serve. Auto-falls-back on
      # mismatch/OOM; never overrides an explicit --kv-cache-memory.
      # [2026-07-19 BUG-107] OFF — fingerprint-identical to endgame8020, so this
      # bench compose consumed/armed PROD's plan via the shared startup_plan dir
      # (proven: 12:17/13:34 bench boots ran prod's hot 153,064 plan). Skip-path
      # design flaw = BUG-078 re-class; see endgame8020.yml + loop file 07-19.
      - VLLM_ENABLE_STARTUP_PLAN=0
      # [2026-07-13 Wave-3b] arms the torch profiler endpoints (inert until /start_profile)
      # DEV_MODE required: /start_profile //stop_profile are dev-mode-gated on dev1060.
      - VLLM_TORCH_PROFILER_DIR=/profiles
      - VLLM_SERVER_DEV_MODE=1
      # [BUG-072 mitigation 2026-07-14] garbage_collection_threshold:0.85 —
      # reclaim cached-unused blocks under pressure instead of growing the
      # reservation to the guardian cap and OOM-aborting engine steps (the
      # post-storm wedge: reserved-at-high-water never freed, every request
      # finish=abort until podman restart). From genesis main's 24GB
      # single-card recipe (a7ef419) — previously dropped, re-adopted after
      # the wedge reproduced twice under sustained mixed load.
      - PYTORCH_CUDA_ALLOC_CONF=${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True,garbage_collection_threshold:0.85}
      - VLLM_FLOAT32_MATMUL_PRECISION=high
      - VLLM_USE_FLASHINFER_SAMPLER=1
      - OMP_NUM_THREADS=1
      - CUDA_DEVICE_MAX_CONNECTIONS=8
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
      # [PN105 2026-07-18] per-request NaN-logits counts (abort wiring)
      - VLLM_COMPUTE_NANS_IN_LOGITS=1
      # [H119 2026-07-25] lens-router: SHADOW mode (log+sink only, acts on
      # nothing). Enforce = USER decision. PN119-BUILD-PACK.md is the spec.
      # RENAMED from "PN119" 2026-07-25 — that id already belonged to lane-2's
      # TurboQuant k8v4 GQA kernel (GENESIS_ENABLE_PN119 below, line ~385).
      # See ~/shared/PATCH-ID-COLLISION-AUDIT-20260725.md.
      # This IS the flag the router reads. The old name
      # GENESIS_ENABLE_PN119_ROUTER still works as a legacy fallback, but it is
      # now resolved inside fixes/pn119_router.py (canonical-first,
      # first-SET-wins), NOT by an entrypoint alias — that shim was removed
      # 2026-07-26. Consequence worth knowing: setting the canonical name to 0
      # is a real kill-switch even if a stale legacy export says 1.
      - GENESIS_ENABLE_H119_LENS_ROUTER=1
      - PN119_MODE=${PN119_MODE:-enforce}
      - PN119_TDEEP=${PN119_TDEEP:-0.495}
      - GENESIS_PN119_PROBE=/pn119/probe.npz
      - PN119_SINK=/pn119-sink
      # [H119 route-consumer 2026-07-25] the ENFORCE decision's BUDGET half.
      # DEFAULT OFF. Needs BOTH this flag AND PN119_MODE=enforce; with either
      # missing the worker-side holder behaves exactly as upstream ships it.
      # What it does: a request the CALLER left unbudgeted gets a provisional
      # deep cap at batch-add, rewritten to the routed cap on the first sampler
      # call after the route lands (same engine step as its prefill, before its
      # first token). What it does NOT do: the PN102 v5-vs-v3 BANNER is rendered
      # into the prompt pre-prefill and the route is derived FROM that prefill,
      # so selecting the banner from the route is circular — this is the budget
      # half only, NOT the full deep/lean treatment. Expect a fraction of the
      # measured saving. Counters: h119_routed_deep / h119_routed_lean /
      # h119_route_missing in the router's stats_line().
      # LEAN=800: v3fam measured 778 rtok/req at 100% consolidate parse
      # (~/shared/REPORT-prodmatrix-goal80-20260724.md §1), rounded onto PN100's
      # 100-token grid. That 778 is a MEAN of a banner-shaped arm, not a cap it
      # respected — as a hard cap 800 truncates the upper half of the spend
      # distribution. DEEP=10240 = GENESIS_PN100_BUDGET_CEIL, the champion path's
      # own ceiling (binds only on runaways at ~1575 rtok/req measured).
      - GENESIS_ENABLE_H119_ROUTE_BUDGET=${GENESIS_ENABLE_H119_ROUTE_BUDGET:-1}
      - H119_DEEP_BUDGET=${H119_DEEP_BUDGET:-10240}
      - H119_LEAN_BUDGET=${H119_LEAN_BUDGET:-1600}
      - TRITON_CACHE_DIR=/root/.triton/cache
      # Genesis opt-ins
      # [BUG-071 CORRECTED 2026-07-14] GENESIS_PREALLOC_TOKEN_BUDGET=16384 REMOVED —
      # disproven theory: the long-prefill "aten::empty" failure is a MASKED CUDA
      # OOM of the per-chunk MLP gate+up intermediate (4128 tok x 17408 x fp16 x 2
      # ~= 276 MiB — matches the live failing alloc byte-for-byte), NOT a
      # core_attn_out alloc. Preallocating core_attn_out at 16384 rows just
      # reserved ~316 MiB at boot and made the headroom WORSE. Long prefills
      # succeed when >=276 MiB is free at the chunk peak (15K validated 200 OK
      # cold, 6.5s) and abort gracefully via oom_resilience when the scratch
      # high-water has consumed it (BUG-072 tracks the post-storm wedge).
      # P73 resolver fixed 2026-07-14 (fallback no longer cached) so P28's
      # buffer sizes to the real max_num_batched_tokens (4128) once the vLLM
      # config context exists — every chunk stays on the fast prealloc path.
      # [BUG-072 2026-07-14] Global prealloc budget pinned to the real 4128 max
      # chunk (+32 slack) so every P28/P73-resolver consumer sizes to reality
      # (the resolver caches its FIRST resolution; before this pin it could
      # cache a wrong value). NOTE: the 17 x [8192,24,256] fp16 = 1.63 GiB
      # resident tensor LIST found by the tracer is NOT P28's (unchanged by
      # this pin; owner = an anonymous list — piecewise/workspace class,
      # gc-referrer walk got to 'list held by list'; NEXT-SESSION thread).
      # A/B-acquitted: prefix-cache, GPB pools (registry empty), warmup trio,
      # PN31 (its own unbounded-pool bug was real and is fixed separately).
      - GENESIS_PREALLOC_TOKEN_BUDGET=4160
      - GENESIS_ENABLE_VRAM_TRACER=${GENESIS_ENABLE_VRAM_TRACER:-0}
      # [2026-07-14 BUG-072] torch allocator memory-history + snapshot dumps
      # (armed on first engine step; needs TRACER=1 too; debug only)
      - GENESIS_VRAM_MEMHIST=${GENESIS_VRAM_MEMHIST:-0}
      # [BUG-072 FIX 2026-07-14] P38 TQ-continuation pools are lazily allocated on
      # the FIRST long prefill, sized to max_model_len, AFTER the profiler already
      # gave that VRAM to KV (P72 caps the profile run at M=2048 so profiling never
      # triggers them) -> the process then sits above budget forever and every
      # subsequent large prefill OOM-aborts. Cap the pools to the real traffic
      # ceiling (6-day Phoenix p99 total = 30.8K; zero >60K): 33024 = 30.8K + margin,
      # block-rounded. Prefills >33K take P38 transient-alloc fallback (guard :461).
      - GENESIS_TQ_MAX_MODEL_LEN=33024
      - GENESIS_ENABLE_P58_ASYNC_PLACEHOLDER_FIX=0
      - GENESIS_ENABLE_P64_QWEN3CODER_MTP_STREAMING=1
      # [2026-07-14 OFF — behavioral, canary-proven harmful] P68 forced
      # tool_choice=required on EVERY >50K-char context (canary system =
      # ~120K chars) -> degenerate 21+ tool-call storms + grammar-reject
      # empty responses. Repo rule: behavioral patches never default-on.
      - GENESIS_ENABLE_P68_AUTO_FORCE_TOOL=0
      - GENESIS_ENABLE_P69_LONG_CTX_TOOL_REMINDER=0
      - GENESIS_P68_P69_LONG_CTX_THRESHOLD_CHARS=50000
      - GENESIS_ENABLE_P72_PROFILE_RUN_CAP=1
      - GENESIS_PROFILE_RUN_CAP_M=4128
      - GENESIS_ENABLE_P74_CHUNK_CLAMP=1
      - GENESIS_ENABLE_P94=1
      # [2026-07-25 USER KV-headroom push] PN8 promoted — no-ops on this config
      # (see tcbench8021.yml correction note); harmless, kept for parity.
      - GENESIS_ENABLE_PN8_MTP_DRAFT_ONLINE_QUANT=1
      # [2026-07-25] ladder knobs (inert defaults; flip per-boot via unit env).
      # THESE LINES ARE LOAD-BEARING even at their default: podman-compose can
      # only forward a unit drop-in (e.g. mtp-head-quant.conf) into the container
      # for a variable that is DECLARED here. Without this line, dropping
      # VLLM_MTP_HEAD_QUANT=fp8 onto the prod unit is a SILENT NO-OP and quietly
      # costs the measured +8,387 KV tokens / +2.5% tok/s that the fp8 MTP-head
      # quant buys (bench A/B 2026-07-25: KV 134,193 -> 142,580, acceptance 83.3%
      # on real prod traffic, 0 defects both legs).
      - VLLM_MTP_HEAD_QUANT=${VLLM_MTP_HEAD_QUANT:-off}
      - VLLM_TQ_LAYER_BITS=${VLLM_TQ_LAYER_BITS:-}
      - GENESIS_ENABLE_PN17_FA2_LSE_CLAMP=1
      - GENESIS_ENABLE_PN19_SCOPED_MAX_SPLIT=1
      # [2026-07-14] PN59 (streaming GDN) DISABLED so chunk.py keeps a plain fused-replaceable
      # body for the self-made Cliff-2b FUSED kernel (register-resident h+v_new: -2.74 GiB +
      # faster decode). PN59 wins by position if left on → fused kernel becomes dead code.
      # A/B switch: VLLM_FLA_GDN_FUSED (below). Set PN59=1 + FUSED=0 to revert to streaming.
      - GENESIS_ENABLE_PN59_STREAMING_GDN=0
      # Cliff-2b fused GDN kernel A/B switch (read by patched fla/ops/chunk.py): 1=fused, 0=vanilla.
      - VLLM_FLA_GDN_FUSED=1
      - GENESIS_ENABLE_P67_TQ_MULTI_QUERY_KERNEL=1
      # [cudagraph 2026-06-26] capture-safety for cudagraphs + MTP + TQ3 (+ PN79 fix in entrypoint):
      - GENESIS_ENABLE_P66_CUDAGRAPH_SIZE_FILTER=1
      # [endgame FULL_AND_PIECEWISE cluster — Sander v12] PN125 flips cudagraph_mode
      # to FULL_AND_PIECEWISE (attn FULL, GDN piecewise); warmups pre-compile every
      # JIT kernel so FULL capture never hits an uncompiled kernel (the historical crash);
      # PN358 refreshes forward-ctx tensors before replay (MTP correctness).
      - GENESIS_ENABLE_PN125_HYBRID_FULL_AND_PIECEWISE=1
      - GENESIS_ENABLE_PN126_V1_DECODE_WARMUP=1
      - GENESIS_ENABLE_PN128_SPEC_DECODE_WARMUP=1
      - GENESIS_ENABLE_PN129_SLOT_MAPPING_WARMUP=1
      - GENESIS_ENABLE_PN130_TQ_DECODE_WARMUP=1
      - GENESIS_ENABLE_PN364_HYBRID_GDN_WARMUP=1
      - GENESIS_ENABLE_PN521_TQ_RAW_TAIL_VERIFY=1
      - GENESIS_ENABLE_PN522_TQ_RAW_TAIL_WARMUP=1
      - GENESIS_ENABLE_PN358_FULL_CG_CONTEXT_REFRESH=1
      - GENESIS_PN358_MODE=fallback
      - GENESIS_ENABLE_P78_TOLIST_CAPTURE_GUARD=1
      - GENESIS_ENABLE_PN14_TQ_DECODE_OOB_CLAMP=1
      - GENESIS_ENABLE_PN70_TOOL_SCHEMA_FILTER=1
      # [2026-07-22 k260 repro - mainline: continuous k=260, growth OFF, PN108 shadow]
      - GENESIS_PN100_CONTINUOUS=1
      - GENESIS_PN100_TOK_PER_STEP=260
      - GENESIS_ENABLE_PN108_PLATEAU_CAP=1
      # [2026-07-23 05:58Z PN108 enforce->SHADOW for the t1.0 re-baseline:
      # entered via ship-stack config b395669b, never solo-validated, and it
      # FIRES live (plateau ENFORCE fire in probdraft logs). Baseline rule:
      # only validated mechanisms in the base; discretionary = shadow/dark.]
      - GENESIS_PN108_MODE=shadow
      - GENESIS_PN108_GROW=0
      # [2026-07-22 PN112 settled-stop — SHADOW first: logs would-fire + conf
      # checkpoints for TAU calibration; zero behavioral change in shadow]
      # [2026-07-23 SHIP-STACK confirmation boot (USER-approved contender run):
      # PN112 enforce tau13.0/floor600 with GRACE=384 (grace-boost — 0/123
      # fires had in-think statements, so the soft gate reduces to a bigger
      # runway; removes the 038/042 mid-derivation kill class) + PN108 enforce
      # (validated safe) + P-pess highstep x1.25 (never-under insurance).
      # Projection 82-83 @ 31-32s vs banked k260 83 @ 33.9s.]
      # [2026-07-23 R5 CONFIRM screen: grace back to 64 (its ctok savings were
      # real; 384's relocation erased them live — shipstack2 killed n=42),
      # marginal-band fires probe-guarded (GENESIS_PN112_CONFIRM). P-pess
      # stays (never-under, uncontroversial).]
      # [2026-07-23 ROUTER-PRECISION baseline reset (kickstart §8 first action):
      # end-side lane closed at signal ceiling — PN112 back to SHADOW (free
      # ckpt/tokstep telemetry, zero behavioral change), CONFIRM + PN114 probe
      # lines removed (dark, available). Base = k260 + P-pess only, so router
      # screens compare cleanly vs banked k260.]
      - GENESIS_ENABLE_PN112_SETTLED_STOP=1
