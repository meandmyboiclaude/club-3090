      # key_schema (the default "steps" schema ignores it).
      - GENESIS_PN162_CHARS_PER_TOK=${GENESIS_PN162_CHARS_PER_TOK:-3.6}
      # [PN162 EXACT — USER RULING PENDING, SEPARATE FLAG] per-PROMPT memory:
      # a prompt that was force-closed last time gets max(grant, last x1.25)
      # immediately instead of waiting for its bucket to drift. That is a
      # per-item bench history, which the bench-protocol rule forbids for bench
      # traffic — hence its own flag, default 0. It is also INERT: the PN119
      # sink carries no prompt hash, so nothing populates the map (the read
      # path is live + tested so wiring it is one router line).
      - GENESIS_ENABLE_PN162_EXACT=${GENESIS_ENABLE_PN162_EXACT:-0}
      - GENESIS_PN162_EXACT_MULT=${GENESIS_PN162_EXACT_MULT:-1.25}
      # [PN162 EXPLORE — USER RULING PENDING, SEPARATE FLAG] the LEAN lane
      # ANNOUNCES N into the prompt (PN102 v3 "about N short reasoning steps"),
      # so an under-announced N self-fulfils: the model paces to N, stops
      # clean, nothing binds, and the bound/slack loop is blind to it. On eps of
      # requests this announces N+delta and tags the row (vllm_xargs x_caller ->
      # the sink's `caller` column) so the updater can compare arms. eps 0.0 =
      # every request labelled control, nothing perturbed.
      - GENESIS_ENABLE_PN162_EXPLORE=${GENESIS_ENABLE_PN162_EXPLORE:-0}
      - PN162_EXPLORE_EPS=${PN162_EXPLORE_EPS:-0.0}
      - PN162_EXPLORE_DELTAS=${PN162_EXPLORE_DELTAS:-1,2}
      - PN162_EXPLORE_BUDGET_FOLLOWS=${PN162_EXPLORE_BUDGET_FOLLOWS:-1}
