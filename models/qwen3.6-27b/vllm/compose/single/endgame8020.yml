      # non-replayssm CACHE_OVERRIDE, or boot fails with the ValueError above.
      # ⚠ CONSEQUENCE for the entrypoint (see patch_pr48361_mamba_align_split.py):
      # prod was the only endpoint running align+APC, which is what made PR48361
