      # pn119-live/pn162-ledger.json (tmp+rename); the consumer mtime-caches it
      # and hot-reloads. Missing/ bad ledger, or flag off = exact current
      # behaviour. Mechanism + boot receipts: ~/shared/needfit/PN162-BUDGET-CAL.md
      # MUTUALLY EXCLUSIVE with GENESIS_PN100_STEP_BUDGET_MAP (which must stay
      # unset — it is an absolute fitted budget; the consumer refuses to
      # multiply on top of it and says so in the log).
      - GENESIS_ENABLE_PN162_BUDGET_CAL=${GENESIS_ENABLE_PN162_BUDGET_CAL:-0}
      - GENESIS_PN162_LEDGER=${GENESIS_PN162_LEDGER:-/pn162/pn162-ledger.json}
