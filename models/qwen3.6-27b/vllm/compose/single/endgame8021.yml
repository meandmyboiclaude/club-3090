        python3 /fixes/patch_pn95_43357_tq_prefill_workspace_sizing.py
        # [PN96 2026-07-13] vllm#44993 backport: marker-step tokens enter grammar FSM
        # (BUG-070 `{{` fix; supersedes never-applying P62 on dev1060+). Gate:
