        # [2026-07-14] PN84 vllm#42245 (NOT merged in pin): zero-init prompt_logprobs on
        # prefix-cache-skipped tokens → deterministic; standing prereq for packed rerank (PN81).
        python3 /fixes/patch_pn84_42245_prompt_logprobs_zeros.py
        # [Wave-1 2026-07-13] correctness backports vs BUG-069 + crash classes.
