      # USER: enable everything, none skipped; crash/quality-breakers FIXED not ditched.
      # PN77=0 (degenerate token-soup, quality killer). PN399 deduped→/fixes PN79 (IMA gone).
      # Flag names verified vs vendored registry. Exonerated: P60/P60b/P70 (baseline degraded w/o them).
      # [2026-07-14] ALL ON. Arch/topology-gated ones self-gate to no-op on our SM89/TP=1 rig
