# ===========================================================================
# Profile (at-a-glance):
#   Model:     Qwopus3.6-27B-v2-GPTQ-Pro-MTP-BF16 (XReyRobert, GPTQ-4bit Marlin
#              + dedicated BF16 MTP head — concise-reasoning fine-tune of Qwen3.6)
#   Topology:  Single 4090 (TP=1)
#   Drafter:   MTP n=3 (model-mtp-bf16.safetensors)
#   KV:        turboquant_3bit_nc
#   Vision:    no (--language-model-only)
#   Max ctx:   75K model-len (TQ3 KV)
#   Image:     vllm nightly-b53b1c7 (0.23.1rc1.dev178)
#   Genesis:   v7.72.2
#   Status:    adoption candidate (validate before promoting to aibox.yml)
#   Best for:  IDE-agent workloads — leaner thinking than Lorbus base
# ---------------------------------------------------------------------------
# Qwopus variant of tools-text. Deltas vs tools-text-aibox.yml (Lorbus):
#   image  nightly-b4c80ec0 -> nightly-b53b1c7
#   model  /root/.cache/huggingface/qwen3.6-27b-autoround-int4 -> XReyRobert repo-id
#   quant  auto_round -> gptq_marlin (+ --dtype float16 --disable-custom-all-reduce)
#   mount  models-cache -> /home/user/.cache/huggingface (where the Qwopus snapshot lives)
# Everything else (TQ3 KV, MTP n=3, froggeric template, util 0.91, 5 seqs,
# Genesis + /fixes PN71-74 wiring, served-model aliases) is unchanged.
#
# Run with:
#   cd <repo>/models/qwen3.6-27b/vllm/compose
#   podman-compose -f single/tools-text-qwopus.yml up -d
# ===========================================================================
services:
  vllm-qwen36-27b:
    image: docker.io/vllm/vllm-openai:nightly-b53b1c7ffe7aebdafd0876350f30e51d1226c92a
    container_name: vllm-qwen36-27b-tools-text
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8020/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
    volumes:
      # Qwopus snapshot lives in the user HF hub cache (not models-cache).
      - /home/user/.cache/huggingface:/root/.cache/huggingface
      # torch.compile + Triton kernel caches — first boot warms (~60-90 sec);
      # subsequent boots reuse cached graphs. Pattern from Sander's PROD launch.
      # Closes club-3090 #22.
      - ../../cache/torch_compile:/root/.cache/vllm/torch_compile_cache
      - ../../cache/triton:/root/.triton/cache
      # Genesis v7.14+ modular package (replaces patch_genesis_unified.py).
      - ../../patches/genesis/vllm/_genesis:/usr/local/lib/python3.12/dist-packages/vllm/_genesis:ro
      - ../../patches/local/qwen3coder_tool_parser_deferred_commit.py:/patches/qwen3coder_tool_parser_deferred_commit.py:ro
      - ../../patches/froggeric-chat-template/chat_template.jinja:/chat_template.jinja:ro
      - ../../../../../fixes:/fixes:ro
      - ./cache-override.yaml:/config/cache-override.yaml:ro
    environment:
      # - CUDA_VISIBLE_DEVICES=0
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - NCCL_CUMEM_ENABLE=0
      - NCCL_P2P_DISABLE=1
      - VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=0
      - VLLM_ENFORCE_EAGER=1
      - VLLM_NO_USAGE_STATS=1
      - PYTORCH_CUDA_ALLOC_CONF=${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
      - VLLM_FLOAT32_MATMUL_PRECISION=high
      - VLLM_USE_FLASHINFER_SAMPLER=1
      - OMP_NUM_THREADS=1
      - CUDA_DEVICE_MAX_CONNECTIONS=8
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
      - TRITON_CACHE_DIR=/root/.triton/cache
      # Genesis opt-ins
      - GENESIS_ENABLE_P58_ASYNC_PLACEHOLDER_FIX=1
      - GENESIS_ENABLE_P64_QWEN3CODER_MTP_STREAMING=1
      - GENESIS_ENABLE_P68_AUTO_FORCE_TOOL=1
      - GENESIS_ENABLE_P69_LONG_CTX_TOOL_REMINDER=1
      - GENESIS_P68_P69_LONG_CTX_THRESHOLD_CHARS=50000
      - GENESIS_ENABLE_P72_PROFILE_RUN_CAP=1
      - GENESIS_PROFILE_RUN_CAP_M=2048
      - GENESIS_ENABLE_P74_CHUNK_CLAMP=1
      - GENESIS_ENABLE_P94=1
      - GENESIS_ENABLE_PN8_MTP_DRAFT_ONLINE_QUANT=1
      - GENESIS_ENABLE_PN17_FA2_LSE_CLAMP=1
      - GENESIS_ENABLE_PN19_SCOPED_MAX_SPLIT=1
      - GENESIS_ENABLE_PN59_STREAMING_GDN=1
      - GENESIS_ENABLE_P67_TQ_MULTI_QUERY_KERNEL=1
      - GENESIS_ENABLE_PN14_TQ_DECODE_OOB_CLAMP=1
      - GENESIS_ENABLE_PN70_TOOL_SCHEMA_FILTER=1
      # Performance
      - GENESIS_ENABLE_P40=1
      - GENESIS_ENABLE_P82=1
      - GENESIS_ENABLE_PN50_GDN_FUSED_PROJ=0
      # Correctness
      - GENESIS_ENABLE_P91=1
      - GENESIS_ENABLE_P107_MTP_TRUNCATION_DETECTOR=1
      - GENESIS_ENABLE_P59_QWEN3_TOOL_RECOVERY=1
      - GENESIS_ENABLE_P62_STRUCT_OUT_SPEC_TIMING=1
      # OOM Protection
      - GENESIS_ENABLE_PN32_GDN_CHUNKED_PREFILL=1
      - GENESIS_ENABLE_PN12_FFN_INTERMEDIATE_POOL=1
      - GENESIS_ENABLE_P15B_FA_VARLEN_CLAMP=1
      - GENESIS_ENABLE_PN66=1
      - GENESIS_ENABLE_PN67=1
      - GENESIS_ENABLE_PN61=1
      - GENESIS_ENABLE_PN62=1
      - GENESIS_ENABLE_P83=1
      - GENESIS_ENABLE_PN54_GDN_CONTIGUOUS_DEDUP=1
      # OTEL tracing -> Phoenix (host net, gRPC OTLP :4317). Lands in "vllm" project.
      - OTEL_RESOURCE_ATTRIBUTES=openinference.project.name=vllm,service.name=vllm-qwen36
      # VRAM Guardian thresholds, fitted to util. SOFT must sit ABOVE the under-load
      # steady (% of torch-total 24109MB) or it gc-thrashes every poll. Measured:
      # 0.90 steady ~96.7% (SOFT 97 ok), 0.92 steady ~98.9% (SOFT 97 thrashed).
      # At 0.91 steady ~97.8% -> SOFT 98 / HARD 99 (HARD leaves ~700MB board headroom).
      - VRAM_GUARDIAN_SOFT_PCT=98
      - VRAM_GUARDIAN_HARD_PCT=99
      - VRAM_GUARDIAN_POLL_MS=200
    network_mode: host
    ipc: host
    # Explicit CDI device = reliable podman GPU injection. Do NOT rely solely on
    # podman-compose translating the docker-style `deploy` block below — that
    # translation is version-dependent and can silently boot the container
    # GPU-blind (then capability-gated patches mis-apply and vLLM serves on CPU).
    # CDI spec lives at /etc/cdi/nvidia.yaml (regen: nvidia-ctk cdi generate).
    devices:
      - nvidia.com/gpu=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        # [gpu-guard] Fail LOUD if the GPU isn't visible BEFORE applying any patches.
        # Capability-gated Genesis patches (GDN backend select, TQ kernels) must see the
        # real device — a GPU-blind boot would mis-gate them and serve on CPU. Never silent.
        python3 -c "import torch; assert torch.cuda.is_available(), 'no CUDA device visible'; print('[gpu-guard] OK', torch.cuda.get_device_name(0), 'cap', torch.cuda.get_device_capability(0), 'count', torch.cuda.device_count())" \
          || { echo '[gpu-guard] FATAL: GPU not visible in container — refusing to apply patches or serve (would run blind/CPU). Ensure CDI device nvidia.com/gpu=all is injected (/etc/cdi/nvidia.yaml).' >&2; exit 1; }
        if [ ! -f /usr/local/lib/python3.12/dist-packages/vllm/_genesis/patches/apply_all.py ]; then
          echo "ERROR: Genesis patches missing — host volume models/qwen3.6-27b/vllm/patches/genesis/ is empty." >&2
          echo "       Run from repo root before 'docker compose up':" >&2
          echo "         bash scripts/setup.sh qwen3.6-27b" >&2
          exit 1
        fi
        pip install -q pytest 2>/dev/null || true
        python3 -m vllm._genesis.patches.apply_all
        python3 /patches/qwen3coder_tool_parser_deferred_commit.py
        python3 /fixes/patch_drafter_skip.py
        python3 /fixes/patch_tq_buffer_pool.py
        python3 /fixes/patch_vram_guardian.py
        python3 /fixes/patch_gdn_oom_retry.py
        python3 /fixes/patch_oom_resilience.py
        python3 /fixes/patch_pn71_reasoning_alias.py
        python3 /fixes/patch_pn72_streaming_toolcall_content_recover.py
        python3 /fixes/patch_pn73_vendor_legacy_reasoning_parser.py
        python3 /fixes/patch_pn73t_vendor_legacy_tool_parser.py
        python3 /fixes/patch_pn74_fix_p107_serving_attr.py
        exec vllm serve "$@"
      - --
    command:
      - --enforce-eager
      - --model
      - XReyRobert/Qwopus3.6-27B-v2-GPTQ-Pro-MTP-BF16
      - --served-model-name
      - qwen3.6
      - qwen3.6-autoround
      - qwen3.6-27b-autoround
      - qwen3.6-hindsight
      - qwen3.5-9b-hindsight
      - --quantization
      - gptq_marlin
      - --dtype
      - float16
      - --disable-custom-all-reduce
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "${MAX_MODEL_LEN:-75000}"
      - --gpu-memory-utilization
      - "${GPU_MEMORY_UTILIZATION:-0.91}"
      - --max-num-seqs
      - "5"
      # No num-gpu-blocks-override: profiler auto-sizes KV (~174K at util 0.91 / 75K model-len).
      # 75K model-len (not 90K) shrinks each seq's KV reservation so 5x15K peaks ~87% KV (no
      # 100% pin -> no capacity-queue throttle) AND drops the prefill VRAM spike under guardian
      # SOFT 98 (0 gc-fires). 5-seq is the KV-limited max (6 needs util 0.93 -> thrash/OOM).
      # oom_resilience makes any over-budget prefill a graceful 500, never a crash.
      - --max-num-batched-tokens
      - "4128"
      - --long-prefill-token-threshold
      - "4128"
      - --kv-cache-metrics
      # Per-request inference traces -> Phoenix (request-level spans; detailed
      # phase breakdown left off to avoid per-request latency overhead).
      - --otlp-traces-endpoint
      - http://localhost:4317
      - --collect-detailed-traces
      - all
      - --kv-cache-dtype
      - "${KV_CACHE_DTYPE:-turboquant_3bit_nc}"
      - --language-model-only
      - --trust-remote-code
      - --chat-template
      - /chat_template.jinja
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3}'
      - --config
      - /config/cache-override.yaml
      - --host
      - 0.0.0.0
      - --port
      - "8020"
