# ===========================================================================
# Profile (at-a-glance):
#   Model:     Qwopus3.6-27B-v2-GPTQ-Pro-MTP-BF16 (XReyRobert, GPTQ-4bit Marlin
#              + dedicated BF16 MTP head — concise-reasoning fine-tune of Qwen3.6)
#   Topology:  Single 4090 (TP=1)
#   Drafter:   MTP n=3 (model-mtp-bf16.safetensors)
#   KV:        turboquant_3bit_nc
#   Vision:    no (--language-model-only)
#   Max ctx:   75K model-len (TQ3 KV)
#   Image:     vllm nightly-b53b1c7 (0.23.1rc1.dev178)
#   Genesis:   v7.72.2
#   Status:    adoption candidate (validate before promoting to aibox.yml)
#   Best for:  IDE-agent workloads — leaner thinking than Lorbus base
# ---------------------------------------------------------------------------
# Qwopus variant of tools-text. Deltas vs tools-text-aibox.yml (Lorbus):
#   image  nightly-b4c80ec0 -> nightly-b53b1c7
#   model  /root/.cache/huggingface/qwen3.6-27b-autoround-int4 -> XReyRobert repo-id
#   quant  auto_round -> gptq_marlin (+ --dtype float16 --disable-custom-all-reduce)
#   mount  models-cache -> /home/user/.cache/huggingface (where the Qwopus snapshot lives)
# Everything else (TQ3 KV, MTP n=3, froggeric template, util 0.91, 5 seqs,
# Genesis + /fixes PN71-74 wiring, served-model aliases) is unchanged.
#
# Run with:
#   cd <repo>/models/qwen3.6-27b/vllm/compose
#   podman-compose -f single/tools-text-qwopus.yml up -d
# ===========================================================================
services:
  vllm-qwen36-27b:
    # [2026-07-13 bump candidate] nightly-9e57de71 (main 07-13) — UNPROVEN until
    # functional + bench ±5% + TQ-KV correctness (51878e5b repacked K/V layout; also
    # brings 481e481b hybrid partial prefix-cache). Rollback: validated dev799 image
    # nightly-69715823... via git tag validated-qwopus-69715823.
    image: localhost/vllm-qwen36-endgame:dev1060cherry-2204-20260713
    container_name: vllm-qwen36-27b-tools-text
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8020/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
    volumes:
      # Qwopus snapshot lives in the user HF hub cache (not models-cache).
      - /home/user/.cache/huggingface:/root/.cache/huggingface
      # torch.compile + Triton kernel caches — first boot warms (~60-90 sec);
      # subsequent boots reuse cached graphs. Pattern from Sander's PROD launch.
      # Closes club-3090 #22.
      - ../../cache/torch_compile:/root/.cache/vllm/torch_compile_cache
      - ../../cache/triton:/root/.triton/cache
      # [2026-07-13 #47388] startup-plan persistence (else lost on container recreate)
      - ../../cache/startup_plan:/root/.cache/vllm/startup_plan
      # [2026-07-13 Wave-3b] torch-profiler trace output (enables /start_profile + /stop_profile)
      - ../../diagnostics/torch_profiles:/profiles
      # Genesis v7.14+ modular package (replaces patch_genesis_unified.py).
      - ../../patches/genesis/vllm/_genesis:/usr/local/lib/python3.12/dist-packages/vllm/_genesis:ro
      # [endgame promote 2026-07-13] top-level `sndr` package (Sander deployment shape):
      # lane-2 file patches inject lazy `from sndr...` imports (cuda_graph.py FULL path);
      # the entrypoint-only alias doesn't exist in EngineCore.
      - ../../patches/genesis/vllm/_genesis/sndr:/usr/local/lib/python3.12/dist-packages/sndr:ro
      - ../../patches/local/qwen3coder_tool_parser_deferred_commit.py:/patches/qwen3coder_tool_parser_deferred_commit.py:ro
      - ../../patches/froggeric-chat-template/chat_template.jinja:/chat_template.jinja:ro
      - ../../../../../fixes:/fixes:ro
      - ./cache-override.yaml:/config/cache-override.yaml:ro
    environment:
      # - CUDA_VISIBLE_DEVICES=0
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - NCCL_CUMEM_ENABLE=0
      - NCCL_P2P_DISABLE=1
      - VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=1
      # [2026-07-13] VLLM_ENFORCE_EAGER removed — never a real vLLM env (dev1060 warns
      # "Unknown vLLM environment variable"); eager is controlled by --enforce-eager.
      - VLLM_NO_USAGE_STATS=1
      # [2026-07-13 #47388] persist memory-profiling + suggested kv-cache-memory under
      # VLLM_CACHE_ROOT/startup_plan; matching-fingerprint reboots skip the profiling
      # and cudagraph-estimation passes -> faster time-to-serve. Auto-falls-back on
      # mismatch/OOM; never overrides an explicit --kv-cache-memory.
      # [2026-07-19 BUG-107] OFF — skip-path design flaw (BUG-078 re-class) +
      # shared startup_plan dir cross-arms prod. See endgame8020.yml.
      - VLLM_ENABLE_STARTUP_PLAN=0
      # [2026-07-13 Wave-3b] arms the torch profiler endpoints (inert until /start_profile)
      # DEV_MODE required: /start_profile //stop_profile are dev-mode-gated on dev1060.
      - VLLM_TORCH_PROFILER_DIR=/profiles
      - VLLM_SERVER_DEV_MODE=1
      - PYTORCH_CUDA_ALLOC_CONF=${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
      - VLLM_FLOAT32_MATMUL_PRECISION=high
      - VLLM_USE_FLASHINFER_SAMPLER=1
      - OMP_NUM_THREADS=1
      - CUDA_DEVICE_MAX_CONNECTIONS=8
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
      - TRITON_CACHE_DIR=/root/.triton/cache
      # Genesis opt-ins
      - GENESIS_ENABLE_P58_ASYNC_PLACEHOLDER_FIX=1
      - GENESIS_ENABLE_P64_QWEN3CODER_MTP_STREAMING=1
      - GENESIS_ENABLE_P68_AUTO_FORCE_TOOL=1
      - GENESIS_ENABLE_P69_LONG_CTX_TOOL_REMINDER=1
      - GENESIS_P68_P69_LONG_CTX_THRESHOLD_CHARS=50000
      - GENESIS_ENABLE_P72_PROFILE_RUN_CAP=1
      - GENESIS_PROFILE_RUN_CAP_M=2048
      - GENESIS_ENABLE_P74_CHUNK_CLAMP=1
      - GENESIS_ENABLE_P94=1
      - GENESIS_ENABLE_PN8_MTP_DRAFT_ONLINE_QUANT=1
      - GENESIS_ENABLE_PN17_FA2_LSE_CLAMP=1
      - GENESIS_ENABLE_PN19_SCOPED_MAX_SPLIT=1
      - GENESIS_ENABLE_PN59_STREAMING_GDN=1
      - GENESIS_ENABLE_P67_TQ_MULTI_QUERY_KERNEL=1
      # [cudagraph 2026-06-26] capture-safety for cudagraphs + MTP + TQ3 (+ PN79 fix in entrypoint):
      - GENESIS_ENABLE_P66_CUDAGRAPH_SIZE_FILTER=1
      # [endgame promote 2026-07-13] FULL_AND_PIECEWISE cluster (Sander v12): PN125 mode,
      # PN126-130/364 boot warmups, PN521/522 TQ raw-tail verify path, PN358 replay refresh.
      - GENESIS_ENABLE_PN125_HYBRID_FULL_AND_PIECEWISE=1
      - GENESIS_ENABLE_PN126_V1_DECODE_WARMUP=1
      - GENESIS_ENABLE_PN128_SPEC_DECODE_HELPER_WARMUP=1
      - GENESIS_ENABLE_PN129_SLOT_MAPPING_WARMUP=1
      - GENESIS_ENABLE_PN130_TURBOQUANT_DECODE_WARMUP=1
      - GENESIS_ENABLE_PN364_HYBRID_GDN_MAMBA_WARMUP=1
      - GENESIS_ENABLE_PN521_TQ_RAW_TAIL_VERIFY=1
      - GENESIS_ENABLE_PN522_TQ_RAW_TAIL_WARMUP=1
      - GENESIS_ENABLE_PN358_FULL_CG_CONTEXT_REFRESH=1
      - GENESIS_PN358_MODE=enforce
      - GENESIS_ENABLE_P78_TOLIST_CAPTURE_GUARD=1
      - GENESIS_ENABLE_PN14_TQ_DECODE_OOB_CLAMP=1
      - GENESIS_ENABLE_PN70_TOOL_SCHEMA_FILTER=1
      # Performance
      - GENESIS_ENABLE_P40=1
      - GENESIS_ENABLE_P82=1
      - GENESIS_ENABLE_PN50_GDN_FUSED_PROJ=0
      # Correctness
      - GENESIS_ENABLE_P91=1
      - GENESIS_ENABLE_P107_MTP_TRUNCATION_DETECTOR=1
      - GENESIS_ENABLE_P59_QWEN3_TOOL_RECOVERY=1
      # [endgame promote 2026-07-13] BUG-069 residual parse fallback (no-ops on dev1060
      # parser layout — engages if a later pin restores qwen3coder_tool_parser.py):
      - GENESIS_ENABLE_PN56_QWEN3CODER_XML_FALLBACK=1
      # ===== ENGINE-DECIDES WAVE (2026-07-13 user directive) =====
      # Restore the registry's own default_on semantics: the sndr dispatcher +
      # config_detect + arch gates decide which of the 209 net-new v12 patches
      # engage on THIS stack (the import had forced default_on->off for its
      # no-regression guarantee). Still spec-driven (SNDR_APPLY_VIA_SPECS).
      # Patches that select but fail to anchor WARN -> those get fixes.
      - GENESIS_LEGACY_DEFAULT_ON=1
      # lane-2: trust the sndr registry's own default_on set (28 patches; per-patch
      # config gates still filter, GENESIS_DISABLE_* still vetoes):
      - GENESIS_SNDR_TRUST_DEFAULT_ON=1
      # ===== end ENGINE-DECIDES WAVE =====
      # ----- WAVE-1 Tier A (correctness — triage 2026-07-13) -----
      - GENESIS_ENABLE_PN402_SANITIZE_INVALID_DRAFT_TOKENS=1
      - GENESIS_ENABLE_PN389_GRAMMAR_TIMEOUTS=1
      - GENESIS_ENABLE_PN28_MERGE_ATTN_NAN_GUARD=1
      - GENESIS_ENABLE_PN526_THREADSAFE_SO_TOKENIZER=1
      - GENESIS_ENABLE_PN346B=1
      - GENESIS_ENABLE_PN372_EAGLE_ZERO_SEQLEN_GUARD=1
      - GENESIS_ENABLE_SPN71_THINKING_TAG_NORMALIZE=1
      - GENESIS_ENABLE_SPN73_TOOL_ARGS_SAFE_NORMALIZE=1
      # ----- WAVE-1 Tier B (low-risk perf/arch-caps) -----
      - GENESIS_ENABLE_PN296_ARCH_PROFILE_INIT=1
      - GENESIS_ENABLE_PN300_UNIVERSAL_TRITON_AUTOTUNE_WRAPPER=1
      - GENESIS_ENABLE_PN298_FLA_CHUNK_O_ARCH_WARPS=1
      - GENESIS_ENABLE_PN299_FLA_MULTI_ARCH_WARPS=1
      - GENESIS_ENABLE_PN299B=1
      - GENESIS_ENABLE_PN299C=1
      - GENESIS_ENABLE_PN299D=1
      - GENESIS_ENABLE_PN299E=1
      - GENESIS_ENABLE_PN345=1
      - GENESIS_ENABLE_PN354_GDN_USE_EXP2=1
      - GENESIS_ENABLE_P62_STRUCT_OUT_SPEC_TIMING=1
      # OOM Protection
      - GENESIS_ENABLE_PN32_GDN_CHUNKED_PREFILL=1
      - GENESIS_ENABLE_PN12_FFN_INTERMEDIATE_POOL=1
      - GENESIS_ENABLE_P15B_FA_VARLEN_CLAMP=1
      - GENESIS_ENABLE_PN66=1
      - GENESIS_ENABLE_PN67=1
      - GENESIS_ENABLE_PN61=1
      - GENESIS_ENABLE_PN62=1
      - GENESIS_ENABLE_P83=1
      - GENESIS_ENABLE_PN54_GDN_CONTIGUOUS_DEDUP=1
      # OTEL tracing -> Phoenix (host net, gRPC OTLP :4317). Lands in "vllm" project.
      - OTEL_RESOURCE_ATTRIBUTES=openinference.project.name=vllm,service.name=vllm-qwen36
      # [PN99 2026-07-17] prompt/completion text on llm_request spans (0 = off).
      - VLLM_TRACE_CONTENT_MAX_CHARS=8192
      # [PN100 2026-07-18] auto thinking-budget router: engine self-classifies
      # difficulty 0-3 per budget-less request -> thinking_token_budget tier
      # (0=off,1024,4096,10240). Explicit client params always win; requests
      # with max_tokens<=128 exempt. See _genesis/middleware/auto_budget.py.
      - GENESIS_ENABLE_PN100_AUTO_BUDGET=1
      # [PN101 2026-07-18] answer rescue (hint + repair for bounded requests
      # guillotined by max_tokens). BEHAVIORAL -> ships OFF; flip to 1 after
      # the 30-item regression validates (design doc DESIGN-pn101-*.md).
      - GENESIS_ENABLE_PN101_ANSWER_RESCUE=1
      # [PN102 2026-07-18] Envelope Contract: template banner + think-seed
      # (self-counted steps), planner-router steps, p75=193 tok/step calib.
      - GENESIS_ENABLE_PN102_CONTRACT=1
      - GENESIS_PN100_AUTO_DEFAULT=1
      # VRAM Guardian thresholds, fitted to util. SOFT must sit ABOVE the under-load
      # steady (% of torch-total 24109MB) or it gc-thrashes every poll. Measured:
      # 0.90 steady ~96.7% (SOFT 97 ok), 0.92 steady ~98.9% (SOFT 97 thrashed).
      # At 0.91 steady ~97.8% -> SOFT 98 / HARD 99 (HARD leaves ~700MB board headroom).
      # PN83 chat-class seat cap — 0 = INERT (see PN83 note at --max-num-seqs)
      - GENESIS_PN83_CHAT_SEQS=0
      - VRAM_GUARDIAN_SOFT_PCT=98
      - VRAM_GUARDIAN_HARD_PCT=99
      - VRAM_GUARDIAN_POLL_MS=200
    network_mode: host
    ipc: host
    # Explicit CDI device = reliable podman GPU injection. Do NOT rely solely on
    # podman-compose translating the docker-style `deploy` block below — that
    # translation is version-dependent and can silently boot the container
    # GPU-blind (then capability-gated patches mis-apply and vLLM serves on CPU).
    # CDI spec lives at /etc/cdi/nvidia.yaml (regen: nvidia-ctk cdi generate).
    devices:
      - nvidia.com/gpu=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        # [gpu-guard] Fail LOUD if the GPU isn't visible BEFORE applying any patches.
        # Capability-gated Genesis patches (GDN backend select, TQ kernels) must see the
        # real device — a GPU-blind boot would mis-gate them and serve on CPU. Never silent.
        python3 -c "import torch; assert torch.cuda.is_available(), 'no CUDA device visible'; print('[gpu-guard] OK', torch.cuda.get_device_name(0), 'cap', torch.cuda.get_device_capability(0), 'count', torch.cuda.device_count())" \
          || { echo '[gpu-guard] FATAL: GPU not visible in container — refusing to apply patches or serve (would run blind/CPU). Ensure CDI device nvidia.com/gpu=all is injected (/etc/cdi/nvidia.yaml).' >&2; exit 1; }
        if [ ! -f /usr/local/lib/python3.12/dist-packages/vllm/_genesis/patches/apply_all.py ]; then
          echo "ERROR: Genesis patches missing — host volume models/qwen3.6-27b/vllm/patches/genesis/ is empty." >&2
          echo "       Run from repo root before 'docker compose up':" >&2
          echo "         bash scripts/setup.sh qwen3.6-27b" >&2
          exit 1
        fi
        pip install -q pytest 2>/dev/null || true
        python3 -m vllm._genesis.patches.apply_all
        python3 /patches/qwen3coder_tool_parser_deferred_commit.py
        python3 /fixes/patch_drafter_skip.py
        # [BUG-028] DISABLED: tq_buffer_pool reuses module-level GPU scratch buffers across
        # async decode steps -> race under MTP spec-decode + big prefill -> device-side assert
        # in _flash_attn_varlen. Redundant with PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
        # (the actual VRAM-frag fix). Re-enable only with a stream-aware/synced pool.
        # python3 /fixes/patch_tq_buffer_pool.py
        python3 /fixes/patch_vram_guardian.py
        python3 /fixes/patch_gdn_oom_retry.py
        python3 /fixes/patch_oom_resilience.py
        python3 /fixes/patch_pn71_reasoning_alias.py
        python3 /fixes/patch_pn72_streaming_toolcall_content_recover.py
        # [PN76 — 2026-06-26] Engine-level deferred tool-call commit: holds the <tool_call>
        # open until <function= confirms it is real (the legacy P61c deferred-commit, ported
        # INTO upstream's streaming parser engine). With PN72 this fixes the streaming
        # <tool_call> content-drop AT THE ENGINE, so the vendored legacy parsers below are no
        # longer needed -> we run upstream's parser code. The earlier Rust-adoption trial
        # FAILED test D only because it lacked this deferral. Unit-validated byte-identical on
        # real tool calls; gated live on functional test D + a streaming real tool-call.
        python3 /fixes/patch_pn76_engine_deferred_toolcall_commit.py
        # [SUPERSEDED by PN76 — kept commented for instant rollback if test D regresses]
        # python3 /fixes/patch_pn73_vendor_legacy_reasoning_parser.py
        # python3 /fixes/patch_pn73t_vendor_legacy_tool_parser.py
        python3 /fixes/patch_pn74_fix_p107_serving_attr.py
        python3 /fixes/patch_pn75_embedding_neg_index_guard.py
        # [PN79 RETIRED 2026-07-23 BUG-119] anchor gone on this pin because the
        # #46067 crash class is handled IN-TREE (turboquant_attn.py pre-reserves
        # decode scratch + locks the workspace, lines ~393/~1396). The patch had
        # silently SKIPped on every boot since the pin bump — weeks of conc-4
        # cudagraph+TQ+MTP bench load ran without it, zero device asserts.
        # Archived: /fixes/_archive/patch_pn79_tq_decode_scratch_cudagraph_safe.py
        # (re-anchor only if a future pin drops the in-tree handling).
        # [PN80 — 2026-07-07 dev799 bump] vllm#47609 backport to the V1 runner:
        # skip-layers feature passes cache_dtype_str='auto' for TQ specs (kv_quant_mode
        # stays NONE on TQFullAttentionSpec) -> TurboQuantConfig.from_cache_dtype('auto')
        # ValueError at boot. Upstream fixed only the MRV2 worker path. FAIL-LOUD: without
        # this, TQ3 boot crashes in _init_minimal_kv_cache_for_profiling.
        python3 /fixes/patch_pn80_tq_v1_runner_cache_dtype_preserve.py
        # [PN82 — 2026-07-07] upstream generative_scoring × spec-decode crash fix:
        # logprob_token_ids must not override the rejection sampler's -1 full-vocab
        # sentinel (shape-mismatch EngineCore fatal, live-reproduced on dev799).
        # Prerequisite for PN81 (/rerank on :8020). Upstream-contributable.
        python3 /fixes/patch_pn82_bonus_logprobs_full_vocab_guard.py
        # [Wave-1 2026-07-13] correctness backports vs BUG-069 + crash classes.
        # PN86 vllm#46461: TQ+APC continuation guard (prefix K/V loss -> hallucinations)
        # PN87 vllm#43650: mamba MTP cache-hit boundary (subsumed by #48361 in Wave-3 build)
        # PN88 vllm#47574: zero fresh KV blocks on quantized+hybrid (incl. TQ spec trap)
        # PN89 vllm#46324: documented no-op (Genesis P66 covers); fail-loud if neither
        # PN90 vllm#47828: MTP quant-leak guard — verified no-op on dense, self-activates
        # PN91g vllm#48475: GDN state-index clamp on 0-accepted spec steps
        # PN92 vllm#47490: never silently override explicit spec method
        # PN93 vllm#48053: cudagraph capture_error_mode=thread_local
        # PN94 vllm#47833+#47953: MTP drafts share target embeddings
        python3 /fixes/patch_pn86_46461_tq_prefill_continuation_guard.py
        python3 /fixes/patch_pn87_43650_mamba_eagle_cache_hit_boundary.py
        python3 /fixes/patch_pn88_47574_zero_kv_blocks_quantized_hybrid.py
        python3 /fixes/patch_pn89_46324_piecewise_spec_capture_sizes.py
        python3 /fixes/patch_pn90_47828_mtp_quant_leak_guard.py
        python3 /fixes/patch_pn91g_48475_gdn_spec_state_index_clamp.py
        python3 /fixes/patch_pn92_47490_explicit_spec_method_guard.py
        python3 /fixes/patch_pn93_48053_cudagraph_capture_thread_local.py
        python3 /fixes/patch_pn94_47833_mtp_share_target_embeddings.py
        # [PN95 2026-07-13] vllm#43357: TQ prefill workspace demand-sized pool;
        # reclaims ~300MB unbudgeted reservation; GPU-parity-harness validated.
        python3 /fixes/patch_pn95_43357_tq_prefill_workspace_sizing.py
        # [PN96 2026-07-13] vllm#44993 backport: marker-step tokens enter grammar FSM
        # (BUG-070 `{{` fix; supersedes never-applying P62 on dev1060+). Gate:
        # canary_grammar_mtp.py 0/12 doubled tokens.
        python3 /fixes/patch_pn96_44993_structured_output_marker_step_fsm.py
        # [PN99 2026-07-17] V0-parity gen_ai.prompt/gen_ai.completion on trace
        # spans (Phoenix per-trace prompt visibility; otelcol maps -> input.value).
        # Knob: VLLM_TRACE_CONTENT_MAX_CHARS. Self-retires if upstream re-adds.
        python3 /fixes/patch_pn99_trace_content_prompt_completion.py
        # [PN100 2026-07-18] await-site for the auto thinking-budget router
        # (classify pass; module rides the mounted _genesis tree).
        python3 /fixes/patch_pn100_auto_thinking_budget.py
        # [PN101 2026-07-18] answer-rescue call sites (inert while flag=0).
        python3 /fixes/patch_pn101_answer_rescue.py
        # [PN81 — 2026-07-07] /rerank on :8020 (USER: reranker lives IN vLLM).
        # Adapts TEI + Cohere wire formats onto upstream /generative_scoring
        # (yes/no-logit scoring on the generate engine). Requires PN82.
        # Kill-switch: GENESIS_PN81_RERANK=0.
        python3 /fixes/patch_pn81_rerank_endpoint.py
        # [PN83 — 2026-07-07] rerank micro-slots: chat-class admission cap in the
        # v1 scheduler (GENESIS_PN83_CHAT_SEQS); rerank fills the raised seat count.
        # FAIL-LOUD: never boot 29 seats without the chat cap.
        python3 /fixes/patch_pn83_rerank_micro_slots.py
        exec vllm serve "$@"
      - --
    command:
      # [cudagraph 2026-06-26] PIECEWISE cudagraphs ON (~+50% decode) — eager dropped.
      # Stable on TQ3+MTP+GDN-hybrid via PN79 (fixed TQ decode scratch, #46067) + P66/P78.
      - --compilation-config
      - '{"cudagraph_mode": "FULL_AND_PIECEWISE"}'
      # [Wave-3b 2026-07-13] torch profiler via engine arg (dev1060 retired the env-var
      # gate; routes attach only when profiler-config is set). Inert until /start_profile.
      # REMOVE after the kernel-engineering campaign (dev-only surface).
      - --profiler-config
      - '{"profiler": "torch", "torch_profiler_dir": "/profiles"}'
      - --model
      - XReyRobert/Qwopus3.6-27B-v2-GPTQ-Pro-MTP-BF16
      - --served-model-name
      - qwen3.6
      - qwen3.6-autoround
      - qwen3.6-27b-autoround
      - qwen3.6-hindsight
      - qwen3.5-9b-hindsight
      - --quantization
      - gptq_marlin
      - --dtype
      - float16
      - --disable-custom-all-reduce
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "${MAX_MODEL_LEN:-75000}"
      - --gpu-memory-utilization
      - "${GPU_MEMORY_UTILIZATION:-0.90}"
      # [PN83 — 2026-07-07] rerank micro-slots: PARKED after 2 OOM arms.
      # 29 seats = OOM at KV alloc (~700MB GDN/mamba state over budget);
      # 12 seats = aten::empty alloc failure during warmup (P66 capture list
      # grew [4..96] — the extra cudagraph pools eat the profiler margin).
      # PN83 scheduler patch stays wired but INERT (GENESIS_PN83_CHAT_SEQS=0).
      # Next arm (own window): 8-10 seats + max_cudagraph_capture_size=40
      # (+ maybe util 0.89). Enable = seqs up + env to 5.
      - --max-num-seqs
      - "${MAX_NUM_SEQS:-5}"
      # No num-gpu-blocks-override: profiler auto-sizes KV (~174K at util 0.91 / 75K model-len).
      # 75K model-len (not 90K) shrinks each seq's KV reservation so 5x15K peaks ~87% KV (no
      # 100% pin -> no capacity-queue throttle) AND drops the prefill VRAM spike under guardian
      # SOFT 98 (0 gc-fires). 5-seq is the KV-limited max (6 needs util 0.93 -> thrash/OOM).
      # oom_resilience makes any over-budget prefill a graceful 500, never a crash.
      - --max-num-batched-tokens
      - "4128"
